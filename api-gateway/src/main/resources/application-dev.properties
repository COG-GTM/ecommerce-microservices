# Dev / functional-testing profile (SPRING_PROFILES_ACTIVE=dev): the till API is reachable without a Keycloak
# login, and order/notification lookups are readable so E2E tests can assert persistence. Every other route
# (e.g. /api/product, POST /api/order) still requires a JWT. The price feed is open so E2E tests can publish prices.
app.security.public-paths=/api/till/**,/api/product/price-feed,/api/product/price-feed/**
app.security.public-get-paths=/api/order/**,/api/notification/**
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
logging.level.org.springframework.cloud.gateway=INFO
