spring.application.name=api-gateway-test
server.port=0

# Disable external infra during tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.gateway.discovery.locator.enabled=false
management.tracing.enabled=false

# Dummy JWK set URI so the reactive JWT decoder can be built without a startup fetch
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/jwks

# Only expose minimal actuator endpoints during tests
management.endpoints.web.exposure.include=health
