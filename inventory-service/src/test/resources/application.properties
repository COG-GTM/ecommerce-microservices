spring.application.name=inventory-service-test

# In-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:inventory_service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# Disable external infra during tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
management.tracing.enabled=false
