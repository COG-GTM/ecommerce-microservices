---
services:
  # MySQL Config for order service
  mysql-order:
    container_name: mysql-order
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_service
      MYSQL_USER: ibatulanand
      MYSQL_PASSWORD: password
    volumes:
      - mysql_order_data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: always

  # MySQL Config for inventory service
  mysql-inventory:
    container_name: mysql-inventory
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_service
      MYSQL_USER: ibatulanand
      MYSQL_PASSWORD: password
    volumes:
      - mysql_inventory_data:/var/lib/mysql
    ports:
      - "3308:3306"
    restart: always

  # MongoDB Config for product service
  mongo:
    container_name: mongo
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db


  # Keycloak Config (MySQL Database)
  keycloak-mysql:
    container_name: keycloak-mysql
    image: mysql:8.0
    volumes:
      - mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password

  # Keycloak Config
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:25.0
    command: [ "start-dev", "--import-realm" ]
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: mysql
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-mysql


  # Apache Kafka (Zookeeper) Config
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Apache Kafka (Broker) Config
  broker:
    image: confluentinc/cp-kafka:7.4.4
    container_name: broker
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1


  # Zipkin Config
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"

  # OpenTelemetry Collector Config
  # The Quarkus services export OTLP/gRPC; the collector fans out to Zipkin so the
  # existing Zipkin UI keeps working after the Micrometer/Brave -> OTel switch.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
    depends_on:
      - zipkin


  # Service Discovery (Consul) Config
  # Services are registered declaratively from ./consul (see consul/README.md);
  # no service contains discovery-client code.
  consul:
    image: hashicorp/consul:1.19
    container_name: consul
    command: agent -dev -server -ui -client=0.0.0.0
    ports:
      - "8500:8500"
    volumes:
      - ./consul:/consul/config

  # API Gateway Service Config
  api-gateway:
    image: ibatulanandjp/api-gateway:latest
    container_name: api-gateway
    pull_policy: never
    ports:
      - "8181:8080"
    expose:
      - "8181"
    environment:
      - QUARKUS_HTTP_PORT=8080
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://keycloak:8080/realms/spring-boot-microservices-realm
      - QUARKUS_OIDC_TOKEN_ISSUER=http://localhost:8080/realms/spring-boot-microservices-realm
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - CONSUL_UI_URL=http://consul:8500
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - keycloak
      - consul
      - otel-collector

  # Product Service Config
  product-service:
    container_name: product-service
    image: ibatulanandjp/product-service:latest
    pull_policy: never
    environment:
      - QUARKUS_MONGODB_CONNECTION_STRING=mongodb://mongo:27017
      - QUARKUS_MONGODB_DATABASE=product-service
      - QUARKUS_HTTP_PORT=8080
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - mongo
      - otel-collector
      - consul
      - api-gateway

  # Order Service Config
  order-service:
    container_name: order-service
    image: ibatulanandjp/order-service:latest
    pull_policy: never
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:mysql://mysql-order:3306/order_service?allowPublicKeyRetrieval=true&useSSL=false
      - QUARKUS_DATASOURCE_USERNAME=ibatulanand
      - QUARKUS_DATASOURCE_PASSWORD=password
      - QUARKUS_HTTP_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - mysql-order
      - broker
      - otel-collector
      - consul
      - api-gateway

  # Inventory Service Config
  inventory-service:
    container_name: inventory-service
    image: ibatulanandjp/inventory-service:latest
    pull_policy: never
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:mysql://mysql-inventory:3306/inventory_service?allowPublicKeyRetrieval=true&useSSL=false
      - QUARKUS_DATASOURCE_USERNAME=ibatulanand
      - QUARKUS_DATASOURCE_PASSWORD=password
      - QUARKUS_HTTP_PORT=8080
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - mysql-inventory
      - otel-collector
      - consul
      - api-gateway

  # Notification Service Config
  notification-service:
    container_name: notification-service
    image: ibatulanandjp/notification-service:latest
    pull_policy: never
    environment:
      - QUARKUS_HTTP_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - broker
      - otel-collector
      - consul
      - api-gateway

  # Prometheus Config
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.54.1
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api-gateway
      - product-service
      - order-service
      - inventory-service
      - notification-service

  # Grafana Config
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:11.2.0
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
volumes:
  grafana_data:
  mysql_order_data:
  mysql_inventory_data:
  mysql_keycloak_data:
  mongo_data:
