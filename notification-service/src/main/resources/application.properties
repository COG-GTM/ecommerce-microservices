eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
spring.application.name=notification-service
server.port=0

# Tracing Properties
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.group-id=notificationId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.ibatulanand.notificationservice.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.value.default.type=com.ibatulanand.notificationservice.OrderPlacedEvent

# Error handling: bounded retries, then notificationTopic.DLT (poison pills skip the retries)
notification.kafka.retry.interval-ms=1000
notification.kafka.retry.max-retries=2

# Idempotency: in-memory dedupe on orderNumber + notification type
notification.dedupe.max-entries=100000
notification.dedupe.ttl=PT24H

# Receipt timestamps
notification.receipt.zone=UTC

# Monitoring Properties (Actuator Prometheus Endpoint)
management.endpoints.web.exposure.include=prometheus