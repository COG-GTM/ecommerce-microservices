spring.application.name=notification-service
server.port=0

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
management.tracing.enabled=false
management.zipkin.tracing.export.enabled=false

spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.group-id=notificationId
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ibatulanand.notificationservice
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.ibatulanand.notificationservice.OrderPlacedEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=event:com.ibatulanand.notificationservice.OrderPlacedEvent
