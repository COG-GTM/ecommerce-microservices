name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Tier 1 - unit tests + 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Java unit tests (JaCoCo check fails the build below 100% line/branch)
        run: mvn -B verify -DskipITs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Storefront unit tests (node --test coverage gate 100% lines/branches/functions)
        working-directory: storefront
        run: npm run test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: |
            */target/site/jacoco/
            storefront/coverage/
          if-no-files-found: warn

  integration:
    name: Tier 2a - service integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Failsafe *IT tests against real MongoDB / MySQL / Kafka containers
        run: mvn -B verify -DskipUTs
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            */target/failsafe-reports/
            */target/site/jacoco-it/
          if-no-files-found: warn

  system-e2e:
    name: Tier 2b + 3 - system tests and Playwright E2E on the composed stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start full topology (Keycloak, gateway, Eureka, 4 services, MySQL, MongoDB, Kafka, storefront)
        run: scripts/system-stack.sh up
      - name: System tests over real HTTP (gateway -> order -> inventory, MySQL, Kafka -> notification)
        env:
          SYSTEM_TESTS_COMPOSE_FILE: ${{ github.workspace }}/docker-compose.test.yml
        run: mvn -B -Psystem-tests verify -pl system-tests
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright E2E (video + trace recorded for every test)
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright videos, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-recordings
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
      - name: Upload system test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-reports
          path: system-tests/target/failsafe-reports/
          if-no-files-found: warn
      - name: Dump stack logs on failure
        if: failure()
        run: scripts/system-stack.sh logs
      - name: Tear down
        if: always()
        run: scripts/system-stack.sh down
