# Full service topology for system integration tests and Playwright E2E.
# Spring services run the jars packaged from this checkout (mvn -B package -DskipTests).
# Usage: see scripts/system-stack.sh
name: ecommerce-test

x-spring-env: &spring-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"
  EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
  EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
  MANAGEMENT_TRACING_ENABLED: "false"
  SERVER_PORT: "8080"

services:
  mysql-order:
    image: mysql:8.0.33
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_service
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30

  mysql-inventory:
    image: mysql:8.0.33
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_service
    ports: ["3308:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30

  mongo:
    image: mongo:4.4.24
    ports: ["27017:27017"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  broker:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    # Fixed issuer so tokens minted from the host (tests) and from containers (storefront) both
    # validate against the gateway's issuer-uri.
    command: ["start-dev", "--import-realm", "--health-enabled=true", "--hostname-url=http://keycloak:8080", "--hostname-strict-backchannel=false"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./realms/:/opt/keycloak/data/import/:ro

  discovery-server:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: discovery-server } }
    environment:
      SERVER_PORT: "8761"
      MANAGEMENT_TRACING_ENABLED: "false"
    ports: ["8761:8761"]

  api-gateway:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: api-gateway } }
    depends_on: [discovery-server, keycloak]
    environment:
      <<: *spring-env
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://keycloak:8080/realms/spring-boot-microservices-realm
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: INFO
    ports: ["8181:8080"]

  product-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: product-service } }
    depends_on: [mongo, discovery-server]
    environment:
      <<: *spring-env
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/product-service

  inventory-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: inventory-service } }
    depends_on:
      mysql-inventory: { condition: service_healthy }
      discovery-server: { condition: service_started }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-inventory:3306/inventory_service?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  order-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: order-service } }
    depends_on:
      mysql-order: { condition: service_healthy }
      broker: { condition: service_healthy }
      discovery-server: { condition: service_started }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-order:3306/order_service?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAPSERVERS: broker:29092

  notification-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: notification-service } }
    depends_on:
      broker: { condition: service_healthy }
      discovery-server: { condition: service_started }
    environment:
      <<: *spring-env
      SPRING_KAFKA_BOOTSTRAPSERVERS: broker:29092

  storefront:
    build: ./storefront
    depends_on: [api-gateway]
    environment:
      GATEWAY_URL: http://api-gateway:8080
      OAUTH_TOKEN_URL: http://keycloak:8080/realms/spring-boot-microservices-realm/protocol/openid-connect/token
      OAUTH_CLIENT_ID: spring-cloud-client
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?export OAUTH_CLIENT_SECRET (see scripts/system-stack.sh)}
    ports: ["3001:3001"]
