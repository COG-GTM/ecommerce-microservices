spring.application.name=till-service
server.port=0
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Till identity shown in the till header (override per store/till with TILL_* env vars)
till.store-number=0417
till.store-name=Bradford Demo
till.default-till-id=07
till.operator-id=OP-1001
till.operator-name=Demo Operator

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# PIN pad simulator: how long a TIMEOUT attempt waits before the till reports "no response"
till.terminal.simulator.timeout-delay-ms=1500
