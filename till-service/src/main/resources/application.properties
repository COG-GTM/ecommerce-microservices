spring.application.name=till-service
server.port=0
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Till identity shown in the till header (override per store/till with TILL_* env vars)
till.store-number=0417
till.store-name=Bradford Demo
till.default-till-id=07
till.operator-id=OP-1001
till.operator-name=Demo Operator

# More Card loyalty: points per whole pound paid, and member-only unit prices in pence by barcode
till.more-card.points-per-pound=5
till.more-card.member-prices.1006=300
till.more-card.member-prices.1007=400

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Promotions (MBA-3934), barcodes seeded in product-service by PromotionCatalogueSeeder (3934xx range)
till.promotions.multi-buys[0].id=MB-YOGHURT-3-FOR-350
till.promotions.multi-buys[0].label=Greek yoghurt 3 for \u00a33.50
till.promotions.multi-buys[0].barcodes=393407
till.promotions.multi-buys[0].quantity=3
till.promotions.multi-buys[0].price-pence=350
till.promotions.multi-buys[1].id=MB-DRINKS-2-FOR-200
till.promotions.multi-buys[1].label=Soft drinks 2 for \u00a32.00
till.promotions.multi-buys[1].barcodes=393405,393406
till.promotions.multi-buys[1].quantity=2
till.promotions.multi-buys[1].price-pence=200
till.promotions.meal-deals[0].id=MEAL-DEAL-350
till.promotions.meal-deals[0].label=Meal deal \u00a33.50
till.promotions.meal-deals[0].mains=393401,393402
till.promotions.meal-deals[0].sides=393403,393404
till.promotions.meal-deals[0].drinks=393405,393406
till.promotions.meal-deals[0].price-pence=350
