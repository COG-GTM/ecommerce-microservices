<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecommerce Storefront</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Ecommerce Storefront</h1>
    <button id="cart-toggle" data-testid="cart-badge" type="button">Cart (<span id="cart-count">0</span>)</button>
  </header>
  <main>
    <section id="catalog" aria-labelledby="catalog-heading">
      <h2 id="catalog-heading">Products</h2>
      <p id="catalog-status" role="status">Loading products…</p>
      <ul id="product-list" data-testid="product-list"></ul>
    </section>
    <section id="cart" aria-labelledby="cart-heading">
      <h2 id="cart-heading">Your cart</h2>
      <p id="cart-empty">Your cart is empty.</p>
      <table id="cart-table" hidden>
        <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Line total</th><th></th></tr></thead>
        <tbody id="cart-items"></tbody>
        <tfoot><tr><th colspan="3">Total</th><th id="cart-total" data-testid="cart-total">$0.00</th><th></th></tr></tfoot>
      </table>
      <button id="checkout" type="button" disabled>Checkout</button>
      <p id="checkout-error" role="alert" data-testid="checkout-error" hidden></p>
    </section>
    <section id="confirmation" aria-labelledby="confirmation-heading" data-testid="order-confirmation" hidden>
      <h2 id="confirmation-heading">Order confirmed</h2>
      <p id="confirmation-message"></p>
      <ul id="confirmation-items"></ul>
      <p>Total charged: <strong id="confirmation-total"></strong></p>
      <button id="continue-shopping" type="button">Continue shopping</button>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
